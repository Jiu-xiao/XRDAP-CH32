<style>
  :root, [data-theme="light"] {
    color-scheme: light;
    --paper: #f2f3f2; --paper-raised: #ffffff; --paper-sunken: #e6e8e6;
    --line: #d3d6d3; --line-strong: #7c827e; --ink: #111312; --ink-muted: #4d524f; --on-ink: #f2f3f2;
    --pass: #16693a; --fail: #b42318; --blocked: #7d5100; --focus: var(--ink); --link: var(--ink);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --paper: #0c0e0d; --paper-raised: #151816; --paper-sunken: #070908;
    --line: #2a2e2c; --line-strong: #6f7672; --ink: #e6e8e6; --ink-muted: #a3a9a5; --on-ink: #0c0e0d;
    --pass: #5bd68a; --fail: #ff8a7a; --blocked: #f0b54a; --focus: var(--ink); --link: var(--ink);
  }
  :root {
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
    --space-12: 48px; --chamfer: 8px; --stroke: 1px; --stroke-strong: 2px; --measure-prose: 40em;
    --size-control: 36px; --size-nav: 56px; --duration-fast: 80ms;
    --font-sans: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, "Noto Sans Mono CJK SC", monospace;
  }
  @media (prefers-reduced-motion: reduce) { :root { --duration-fast: 0ms; } }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/28px var(--font-sans); }
  [hidden] { display: none !important; }
  nav {
    height: var(--size-nav); display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--space-4); background: var(--paper-raised); border-bottom: var(--stroke) solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: var(--space-3); color: var(--ink); text-decoration: none; }
  .brand svg { width: 32px; height: 32px; display: block; }
  .brand span { font: 700 14px/22px var(--font-sans); }
  main { max-width: calc(var(--measure-prose) + 2 * var(--space-4)); margin: 0 auto; padding: var(--space-12) var(--space-4); }
  .path { font: 700 12px/16px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
  .path .sep { color: var(--line-strong); }
  h1 { margin: var(--space-2) 0 var(--space-4); font: 700 28px/36px var(--font-sans); }
  .lead { margin: 0 0 var(--space-6); }
  .card {
    position: relative; display: flex; flex-direction: column; gap: var(--space-3);
    padding: var(--space-4); margin-bottom: var(--space-6);
    background: var(--paper-raised); border: var(--stroke) solid var(--line);
  }
  .card::after {
    content: ""; position: absolute; top: calc(-1 * var(--stroke)); right: calc(-1 * var(--stroke));
    width: var(--chamfer); height: var(--chamfer);
    background: linear-gradient(45deg, transparent calc(50% - 0.75px), var(--line) calc(50% - 0.75px), var(--line) calc(50% + 0.75px), var(--paper) calc(50% + 0.75px));
  }
  .card h2 { margin: 0; font: 700 20px/28px var(--font-sans); }
  .note { margin: 0; font: 400 14px/22px var(--font-sans); color: var(--ink-muted); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  .file-name { font: 400 14px/22px var(--font-mono); color: var(--ink-muted); overflow-wrap: anywhere; }
  .check { display: flex; align-items: center; gap: var(--space-2); font: 400 14px/22px var(--font-sans); cursor: pointer; }
  .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; height: var(--size-control);
    padding: 0 var(--space-4); font: 700 14px/22px var(--font-sans); white-space: nowrap; cursor: pointer;
    border: var(--stroke) solid var(--ink); border-radius: 0; color: var(--ink); background: transparent;
    transition: background-color var(--duration-fast) linear, color var(--duration-fast) linear;
  }
  .btn:hover { background: var(--ink); color: var(--on-ink); }
  .btn.primary {
    background: var(--ink); color: var(--on-ink);
    clip-path: polygon(var(--chamfer) 0, 100% 0, 100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%, 0 100%, 0 var(--chamfer));
  }
  .btn.primary:hover { background: var(--ink-muted); border-color: var(--ink-muted); }
  .btn.ghost { border-color: transparent; padding: 0 var(--space-2); text-decoration: underline; text-underline-offset: 4px; }
  .btn.ghost:hover { background: transparent; color: var(--ink); text-decoration-thickness: var(--stroke-strong); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, .check input:focus-visible, a:focus-visible { outline: var(--stroke-strong) solid var(--focus); outline-offset: 2px; }

  .track { height: 8px; border: var(--stroke) solid var(--line-strong); background: var(--paper-sunken); }
  #bar { height: 100%; width: 0; background: var(--ink); }
  #status { margin: 0; min-height: 22px; font: 700 14px/22px var(--font-sans); }
  .pass { color: var(--pass); } .fail { color: var(--fail); } .blocked { color: var(--blocked); }
  .log { background: var(--paper-sunken); border: var(--stroke) solid var(--line); }
  .log-title {
    padding: var(--space-2) var(--space-4); border-bottom: var(--stroke) solid var(--line);
    font: 700 12px/16px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted);
  }
  #log {
    max-height: 264px; overflow: auto; padding: var(--space-3) var(--space-4);
    font: 400 12px/16px var(--font-mono); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  footer { border-top: var(--stroke) solid var(--line); background: var(--paper-sunken); }
  footer div { max-width: calc(var(--measure-prose) + 2 * var(--space-4)); margin: 0 auto; padding: var(--space-6) var(--space-4); font: 400 14px/22px var(--font-sans); color: var(--ink-muted); }
  a { color: var(--link); text-decoration: underline; text-decoration-thickness: var(--stroke); text-underline-offset: 3px; }
  a:hover { text-decoration-thickness: var(--stroke-strong); }
</style>
